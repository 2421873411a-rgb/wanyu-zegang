# 皖域择岗 · nginx 提速片段（P0-9①: 静态 gzip 预压缩 + A2④: /data/ immutable 缓存分级）
# 由 deploy_wan.sh APPLY_NGINX=1 复制到 /etc/nginx/snippets/wan-kaogong-perf.conf
# 生效条件：wan.kaogong.art 的 server{} 内已有 `include snippets/wan-kaogong-perf.conf;`
#
# 缓存三级策略（与 A2 内容寻址配套，v2 计划 A2）：
#   /maintainable/data/     内容寻址（?sha= 即版本）→ 一年 + immutable；数据更新=manifest 更新=URL 更新，永不需 revalidate
#   /maintainable/assets/   ?v= 版本化资产 → 一年 immutable；改版=URL 变
#   index.html / sw.js / manifest.webmanifest → no-cache（每次协商校验；SW 更新与 manifest 驱动的前提）
#
# 站规：所有文本资产在构建期已出 .gz 同名文件（build_gz.py，gzip -9）；
#       gzip_static 直接发预压缩文件（省 CPU），无 .gz 时自动回退原文件。
# 注意（站长须知）：
#   1) nginx 的 add_header 在 location 内出现即不再继承 server{} 级 add_header——
#      若 server{} 有 HSTS/CSP 等安全头，需在以下 location 内补写同款；
#   2) 正则 location 按出现顺序先.match 先赢，include 位置应放在 server{} 内其他正则 location 之前；
#   3) 站点 URI 前缀固定为 /maintainable/（tar 内容物 maintainable/ → SITE_ROOT）。
gzip_static on;
gzip_vary on;

location ~* ^/maintainable/data/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* ^/maintainable/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~* ^/maintainable/(index\.html|sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
}
