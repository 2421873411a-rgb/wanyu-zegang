name: wan-api-ci

on:
  push:
  pull_request:

concurrency:
  group: wan-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 项目源码/wan-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/wan-api/requirements-dev.lock.txt
      - name: 安装精确测试环境
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip check
      - name: Python 静态检查
        run: ruff check app tests --select E9,F63,F7,F82 --ignore E402
      - name: 部署脚本语法检查
        run: bash -n deploy.sh
      - name: SQLite API 门禁
        env:
          ENV: test
        run: pytest tests/ -q
      - name: Alembic 往返 + ORM 漂移门禁（SQLite）
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./_ci_migrate.db"
        run: |
          rm -f _ci_migrate.db
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: 生产 runtime lock 安全审计
        run: pip-audit -r requirements.lock.txt --strict --desc

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wanyu_test
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: wanyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wanyu_test -d wanyu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/wan-api/requirements-dev.lock.txt
      - name: 安装精确测试环境
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip check
      - name: PostgreSQL 迁移往返 + 漂移门禁
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: PostgreSQL API + 真实并发门禁
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
          ENV: test
        run: pytest tests/ -q
      - name: production init_db revision gate
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
          ENV: production
          SECRET_KEY: "ci-test-secret-key-not-for-production-0123456789abcdef"
        run: >-
          python -c "import asyncio; from app.database import init_db;
          asyncio.run(init_db()); print('production init_db PASS')"
