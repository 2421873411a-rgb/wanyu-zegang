name: wan-api-ci

# 去掉 paths filter——required check "test" 必须在所有 PR/push 上产生结果，
# 否则非 API PR 会永远卡在 Expected 状态。job 内部自己判断是否需要跑完整测试。
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: 项目源码/wan-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测 wan-api 是否有变化
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - '项目源码/wan-api/**'
              - '.github/workflows/wan-api-ci.yml'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.api == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/wan-api/requirements.txt
      - name: 安装依赖（精确版本 lock，不二次解析 range）
        if: steps.check.outputs.api == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip check
      - name: 静态检查（ruff，错误级）
        if: steps.check.outputs.api == 'true'
        run: ruff check app tests --select E9,F63,F7,F82 --ignore E402
      - name: 部署脚本语法检查（bash -n）
        if: steps.check.outputs.api == 'true'
        run: bash -n deploy.sh
      - name: 测试（门禁式，SQLite）
        if: steps.check.outputs.api == 'true'
        env:
          ENV: test
        run: pytest tests/ -q
      - name: 迁移漂移检测（ORM metadata vs Alembic 迁移）
        if: steps.check.outputs.api == 'true'
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./_ci_migrate.db"
        run: |
          # 1) 迁移自身往返
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          # 2) ORM metadata vs 迁移产物真实对比（同库，不是两个独立内存库）
          python -c "
          import sys; sys.exit(0)  # placeholder
          "
          python -c "
          from sqlalchemy import create_engine, inspect, text
          from sqlalchemy.schema import CreateTable
          from app.database import Base
          import app.models  # noqa

          # ORM 侧：create_all 到临时文件库
          orm_db = '/tmp/_ci_orm.db'
          import os; [os.remove(f) for f in [orm_db] if os.path.exists(f)]
          e_orm = create_engine(f'sqlite:///{orm_db}')
          Base.metadata.create_all(e_orm)
          orm_tables = set(inspect(e_orm).get_table_names())

          # 迁移侧：从已跑完 alembic upgrade head 的 _ci_migrate.db 读
          e_mig = create_engine('sqlite:///_ci_migrate.db')
          mig_tables = set(inspect(e_mig).get_table_names())

          missing_in_mig = orm_tables - mig_tables
          extra_in_mig = mig_tables - orm_tables - {'alembic_version'}

          if missing_in_mig:
              print(f'ERROR: ORM 有但迁移没有的表: {missing_in_mig}')
              sys.exit(1)
          if extra_in_mig:
              print(f'WARNING: 迁移有但 ORM 没有的表: {extra_in_mig}')

          # 列级对比（nullable + type）+ 约束对比（UNIQUE/CHECK/index）
          diffs = []
          for table in orm_tables & mig_tables:
              orm_cols = {c['name']: c for c in inspect(e_orm).get_columns(table)}
              mig_cols = {c['name']: c for c in inspect(e_mig).get_columns(table)}
              for col in set(orm_cols) | set(mig_cols):
                  o = orm_cols.get(col); m = mig_cols.get(col)
                  if not o: diffs.append(f'{table}.{col}: 迁移多余'); continue
                  if not m: diffs.append(f'{table}.{col}: 迁移缺失'); continue
                  if o.get('nullable') != m.get('nullable'):
                      diffs.append(f'{table}.{col}: nullable ORM={o.get("nullable")} vs MIG={m.get("nullable")}')
                  # type 比较（str 化避免 dialect-specific 类对象差异）
                  ot = str(o.get('type', '')); mt = str(m.get('type', ''))
                  if ot != mt:
                      diffs.append(f'{table}.{col}: type ORM={ot} vs MIG={mt}')
              orm_uc = {frozenset(c['column_names']) for c in inspect(e_orm).get_unique_constraints(table)}
              mig_uc = {frozenset(c['column_names']) for c in inspect(e_mig).get_unique_constraints(table)}
              if orm_uc != mig_uc: diffs.append(f'{table}: UNIQUE ORM={orm_uc} vs MIG={mig_uc}')
              orm_cc = {c['name']: c.get('sqltext','') for c in inspect(e_orm).get_check_constraints(table)}
              mig_cc = {c['name']: c.get('sqltext','') for c in inspect(e_mig).get_check_constraints(table)}
              if orm_cc != mig_cc: diffs.append(f'{table}: CHECK ORM={orm_cc} vs MIG={mig_cc}')
              orm_ix = {(c['name'], tuple(c.get('column_names', ()))) for c in inspect(e_orm).get_indexes(table)}
              mig_ix = {(c['name'], tuple(c.get('column_names', ()))) for c in inspect(e_mig).get_indexes(table)}
              if orm_ix != mig_ix: diffs.append(f'{table}: INDEX ORM={orm_ix} vs MIG={mig_ix}')
          if diffs:
              for d in diffs: print(f'DIFF: {d}')
              sys.exit(1)
          print(f'迁移漂移检测通过: {len(orm_tables)} 表，列+约束+索引一致')
          "
      - name: 依赖安全审计（pip-audit，审计精确 lock 版本，发现高危即红）
        if: steps.check.outputs.api == 'true'
        run: pip-audit -r requirements.lock.txt --strict --desc
      - name: 无 API 变化，跳过
        if: steps.check.outputs.api != 'true'
        run: echo "wan-api not affected, test passed"

  # P1-3：PostgreSQL 16 集成测试（asyncpg + FOR UPDATE + 并发锁 + production init_db）
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wanyu_test
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: wanyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/wan-api/requirements.lock.txt
      - name: 安装依赖
        working-directory: 项目源码/wan-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
      - name: PostgreSQL 迁移往返
        working-directory: 项目源码/wan-api
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL 测试套件
        working-directory: 项目源码/wan-api
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
          ENV: test
        run: pytest tests/ -q
      - name: production init_db 检查（revision gate）
        working-directory: 项目源码/wan-api
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
          ENV: production
          SECRET_KEY: "ci-test-secret-key-not-for-production"
        run: |
          python -c "import asyncio; from app.database import init_db; asyncio.run(init_db()); print('production init_db PASS')"
