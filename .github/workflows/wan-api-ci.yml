name: wan-api-ci

on:
  push:
    branches: [main]
  pull_request:
  # 每周一 03:00 UTC 周检：required 三 check 作 canary 重跑 + security-scan（pip-audit + SBOM）
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wan-api-ci-${{ github.workflow }}-${{ github.ref }}
  # main 分支的 run 永不取消：快速连续 merge 时每笔 main 提交都必须有自身完成的绿记录
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: 项目源码/wan-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/wan-api/requirements-dev.lock.txt
      - name: 安装精确测试环境
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip check
      - name: Python 静态检查
        run: ruff check app tests --select E9,F63,F7,F82 --ignore E402
      - name: 部署脚本语法检查
        run: bash -n deploy.sh
      - name: SQLite API 门禁
        env:
          ENV: test
        run: pytest tests/ -q
      - name: Alembic 往返 + ORM 漂移门禁（SQLite）
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./_ci_migrate.db"
        run: |
          rm -f _ci_migrate.db
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: 生产 runtime lock 安全审计
        run: pip-audit -r requirements.lock.txt --strict --desc
      - name: 开发环境 lock 安全审计
        run: pip-audit -r requirements-dev.lock.txt --strict --desc
      - name: 真数据端到端门禁（canonical+静态 6 快照 → 临时库导入 → 幂等对账）
        env:
          ENV: test
        run: python scripts/e2e_real_data.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wanyu_test
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: wanyu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wanyu_test -d wanyu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/wan-api/requirements-dev.lock.txt
      - name: 安装精确测试环境
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip check
      - name: PostgreSQL 迁移往返 + 漂移门禁
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: PostgreSQL API + 真实并发门禁（含 Redis 限流后端）
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
          REDIS_URL: "redis://localhost:6379/1"
          RATE_LIMIT_BACKEND: "redis"
          ENV: test
        run: pytest tests/ -q
      - name: production init_db revision gate
        env:
          DATABASE_URL: "postgresql+asyncpg://wanyu_test:test_pass@localhost:5432/wanyu_test"
          ENV: production
          SECRET_KEY: "ci-test-secret-key-not-for-production-0123456789abcdef"
          CORS_ORIGINS: '["https://wan.kaogong.art"]'
        run: >-
          python -c "import asyncio; from app.database import init_db;
          asyncio.run(init_db()); print('production init_db PASS')"

  # v17.9.23 安全生命周期：定时依赖审计 + SBOM。仅 schedule/dispatch 触发（不进 PR 门禁，
  # 避免新增 required-check 期望）；失败即红（pip-audit --strict 不吞退出码）。
  security-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 项目源码/wan-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装 pip-audit
        run: python -m pip install --upgrade pip && pip install pip-audit
      - name: runtime lock 漏洞审计
        run: pip-audit -r requirements.lock.txt --strict --desc
      - name: dev lock 漏洞审计
        run: pip-audit -r requirements-dev.lock.txt --strict --desc
      - name: 生成 SBOM（CycloneDX JSON）
        run: |
          pip-audit -r requirements.lock.txt --format cyclonedx-json -o wanyu-api-sbom.json
          python -c "import json; d=json.load(open('wanyu-api-sbom.json')); print('SBOM components:', len(d.get('components', [])))"
      - uses: actions/upload-artifact@v4
        with:
          name: wanyu-api-sbom
          path: 项目源码/wan-api/wanyu-api-sbom.json
          retention-days: 90
