name: canonical-ci

# canonical/static 数据链 CI：每次 push/PR 都跑，required check "canonical" 对所有 PR 生效
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: 项目源码

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目源码/requirements.txt
      - name: 检测 canonical/静态站 是否有变化
        id: check
        uses: dorny/paths-filter@v3
        with:
          filters: |
            canonical:
              - '项目源码/canonical/**'
              - '项目源码/source_data/**'
              - '项目源码/tools/anhui_web/**'
              - '项目源码/tests/**'
              - '项目源码/verify_sources.py'
              - '项目源码/sources.lock.json'
              - '项目源码/requirements.txt'
              - '网站/**'
              - 'docs/**'
              - '.github/workflows/canonical-ci.yml'
      - name: 安装依赖
        if: steps.check.outputs.canonical == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pydantic jsonschema 2>/dev/null || true
      - name: 数据源锁校验（verify_sources）
        if: steps.check.outputs.canonical == 'true'
        run: |
          if [ -d "source_data" ]; then
            python verify_sources.py
          else
            echo "source_data/ 不在 checkout 中（大体积源数据），跳过 verify_sources"
          fi
      - name: canonical schema 校验（validate_canonical）
        if: steps.check.outputs.canonical == 'true'
        run: |
          if [ -d "tools/anhui_web/data/cycles/2024" ] && [ -f "tools/anhui_web/data/score_lists.json" ]; then
            python tools/anhui_web/validate_canonical.py --root .
          else
            echo "canonical 数据文件不在 checkout 中（score_lists.json 等），跳过 validate_canonical"
          fi
      - name: 正式测试套件
        if: steps.check.outputs.canonical == 'true'
        run: python -m unittest tests.test_anhui_web tests.test_data_contract tests.test_source_registry tests.test_catalog_and_changes tests.test_position_detail_contract tests.test_changes_and_comparability tests.test_review_queue tests.test_scores_contract tests.test_datastore_contract tests.test_record_lifecycle tests.test_doc_truth_gate tests.test_build_input_purity tests.test_frontend_data_audit
      - name: 无 canonical 变化，跳过
        if: steps.check.outputs.canonical != 'true'
        run: echo "canonical/static not affected, passed"
